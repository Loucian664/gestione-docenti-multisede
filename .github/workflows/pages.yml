name: Pubblica sito

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Costruisci sito statico
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Trova cartella pubblicata
        id: out
        run: |
          if [ -f dist/client/_shell.html ] || [ -f dist/client/index.html ]; then
            echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -d dist/client ]; then echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -d dist ]; then echo "dir=dist" >> "$GITHUB_OUTPUT"
          elif [ -d .output/public ]; then echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          else echo "Build senza cartella dist" && ls -la && exit 1
          fi
      - name: index.html e 404 (percorsi dell’app)
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          if [ -f "$DIR/_shell.html" ] && [ ! -f "$DIR/index.html" ]; then
            cp "$DIR/_shell.html" "$DIR/index.html"
          fi
          if [ -f "$DIR/index.html" ]; then
            cp "$DIR/index.html" "$DIR/404.html"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
